name: CI
on: [push, pull_request_target]
permissions: write-all
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
      - run: npm install
      - run: npm test
      - name: Deploy
        run: |
          echo "Deploying with ${{ secrets.DEPLOY_TOKEN }}"
          curl -s https://example.com/deploy | bash
